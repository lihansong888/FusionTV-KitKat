name: Android build

on:
  push:
    branches:
      - unified-app-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;36.0.0" "platform-tools" || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build legacy and Python-enabled APKs
        run: ./gradlew :app:assembleLeanbackLegacyDebug :app:assembleLeanbackFullDebug --no-daemon

      - name: Verify legacy APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/leanbackLegacy/debug/leanbackLegacyDebug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Verify Python-enabled APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/leanbackFull/debug/leanbackFullDebug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: fusiontv-legacy-android-4.4
          path: app/build/outputs/apk/leanbackLegacy/debug/leanbackLegacyDebug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Python-enabled APK
        uses: actions/upload-artifact@v4
        with:
          name: fusiontv-full-python-android-7
          path: app/build/outputs/apk/leanbackFull/debug/leanbackFullDebug.apk
          if-no-files-found: error
          retention-days: 7
