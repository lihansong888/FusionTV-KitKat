plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace "com.undcover.freedom.pyramid"
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 28
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "lxml"
            install "pyquery"
            install "requests"
            install "jsonpath"
            install "pycryptodome"
            install "beautifulsoup4"
        }
    }
}

dependencies {
    implementation project(':catvod')
}
